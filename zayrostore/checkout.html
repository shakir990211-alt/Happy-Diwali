<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout - ZAYROSTORE</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;}</style></head><body class="bg-white text-black">
<header class="sticky top-0 z-40 bg-white border-b"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><a href="index.html" class="font-black text-2xl">ZAYRO<span class="font-light">STORE</span></a></div></header>
<main class="max-w-7xl mx-auto px-4 py-8 grid md:grid-cols-2 gap-8">
<form id="shipForm" class="space-y-4" onsubmit="event.preventDefault(); if(validate()){location.href='success.html';}">
  <h2 class="text-2xl font-bold">Shipping</h2>
  <input id="name" class="border w-full px-3 py-2 rounded" placeholder="Full Name">
  <input id="phone" class="border w-full px-3 py-2 rounded" placeholder="Phone">
  <input id="address" class="border w-full px-3 py-2 rounded" placeholder="Address">
  <input id="city" class="border w-full px-3 py-2 rounded" placeholder="City">
  <div class="flex gap-4"><label><input type="radio" name="pay" checked> COD</label><label><input type="radio" name="pay"> Card</label></div>
  <button class="w-full bg-black text-[#D4FF00] py-3 font-bold">Place Order</button>
</form>
<div class="border rounded p-6 h-fit sticky top-20">
  <h2 class="font-bold mb-4">Summary</h2>
  <p id="sumItems"></p>
  <p class="font-bold mt-4" id="sumTotal"></p>
</div>
</main>
<script src="app.js"></script>
<script>
function validate(){const n=document.getElementById('name').value.trim();const p=document.getElementById('phone').value.trim();const a=document.getElementById('address').value.trim();const c=document.getElementById('city').value.trim();if(!n||!p||!a||!c){alert('Fill all fields');return false;}return true;}
const cart=getCart();document.getElementById('sumItems').textContent=cart.length+' items';document.getElementById('sumTotal').textContent='Total: $'+(cart.reduce((s,x)=>s+x.price*x.qty,0)+10);
</script></body></html>

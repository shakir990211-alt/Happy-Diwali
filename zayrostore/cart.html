<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cart - ZAYROSTORE</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;}</style></head><body class="bg-white text-black">
<header class="sticky top-0 z-40 bg-white border-b"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><button onclick="openMenu()" class="md:hidden">☰</button><a href="index.html" class="font-black text-2xl">ZAYRO<span class="font-light">STORE</span></a><nav class="hidden md:flex gap-6 text-sm font-medium"><a href="shop.html">Shop</a><a href="shop.html">New Arrivals</a><a href="shop.html">Men</a><a href="shop.html">Women</a><a href="about.html">About</a></nav><div class="flex items-center gap-4"><a href="wishlist.html">♡<span id="wish-count" class="ml-1 text-xs">0</span></a><a href="cart.html">🛒<span id="cart-count" class="ml-1 text-xs">0</span></a><a href="account.html">👤</a></div></div></header>
<div id="menu-overlay" class="hidden fixed inset-0 bg-black/50 z-50" onclick="closeMenu()"></div>
<aside id="mobile-menu" class="fixed top-0 left-0 h-full w-80 bg-white z-50 -translate-x-full transition-transform duration-300 overflow-y-auto"><div class="p-4 flex justify-between items-center border-b"><span class="font-black text-xl">ZAYRO<span class="font-light">STORE</span></span><button onclick="closeMenu()">✕</button></div><nav class="flex flex-col p-4 gap-3 text-sm"><a href="shop.html">Shop</a><a href="index.html">Home</a><a href="account.html">My Account</a><a href="cart.html">Cart</a><a href="wishlist.html">Wishlist</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="faq.html">FAQ</a></nav><div class="sticky bottom-0 p-4 bg-white border-t"><a href="https://wa.me/1234567890" class="block text-center bg-green-500 text-white py-2 rounded">WhatsApp</a></div></aside>
<main class="max-w-7xl mx-auto px-4 py-8 grid md:grid-cols-3 gap-8">
<div class="md:col-span-2" id="cartItems"></div>
<div class="border rounded p-6">
  <h2 class="font-bold mb-4">Order Summary</h2>
  <div class="flex justify-between mb-2"><span>Subtotal</span><span id="sub">$0</span></div>
  <div class="flex justify-between mb-2"><span>Shipping</span><span>$10</span></div>
  <div class="mb-4"><input id="coupon" class="border px-3 py-2 w-full" placeholder="Coupon code"><button onclick="applyCoupon()" class="mt-2 w-full border py-2">Apply</button></div>
  <div class="flex justify-between font-bold text-lg border-t pt-4"><span>Total</span><span id="total">$0</span></div>
  <a href="checkout.html" class="block text-center bg-black text-[#D4FF00] py-3 mt-4 font-bold">Checkout</a>
</div>
</main>
<footer class="bg-black text-white py-12 mt-16"><div class="max-w-7xl mx-auto px-4 grid md:grid-cols-4 gap-8 text-sm"><div><h3 class="font-bold mb-3">ZAYROSTORE</h3><p class="text-gray-400">Wear The Future.</p></div><div><h3 class="font-bold mb-3">Shop</h3><ul class="space-y-2 text-gray-400"><li><a href="shop.html">All</a></li></ul></div><div><h3 class="font-bold mb-3">Support</h3><ul class="space-y-2 text-gray-400"><li><a href="contact.html">Contact</a></li><li><a href="faq.html">FAQ</a></li></ul></div><div><h3 class="font-bold mb-3">Follow</h3><ul class="space-y-2 text-gray-400"><li>Instagram</li></ul></div></div></footer>
<script src="app.js"></script>
<script>
let discount=0;
function renderCart(){
  const cart=getCart();
  const el=document.getElementById('cartItems');
  if(!cart.length){el.innerHTML='<p>Your cart is empty.</p>';calc();return;}
  el.innerHTML=cart.map(c=>`<div class="flex items-center gap-4 border-b py-4"><img src="${c.img}" class="w-20 h-20 object-cover rounded"><div class="flex-1"><h3 class="font-semibold">${c.name}</h3><p>$${c.price}</p></div><div class="flex items-center gap-2"><button onclick="changeQty(${c.id},-1)" class="border px-2">-</button><span>${c.qty}</span><button onclick="changeQty(${c.id},1)" class="border px-2">+</button></div><button onclick="removeFromCart(${c.id});renderCart()" class="text-red-500">Remove</button></div>`).join('');
  calc();
}
function changeQty(id,d){const cart=getCart();const i=cart.findIndex(x=>x.id===id);if(i>-1){cart[i].qty=Math.max(1,cart[i].qty+d);saveCart(cart);renderCart();}}
function calc(){const sub=getCart().reduce((s,x)=>s+x.price*x.qty,0);const total=sub+10-discount;document.getElementById('sub').textContent='$'+sub;document.getElementById('total').textContent='$'+total;}
function applyCoupon(){if(document.getElementById('coupon').value==='ZAYRO10'){discount=getCart().reduce((s,x)=>s+x.price*x.qty,0)*0.1;calc();alert('10% off applied');}else alert('Invalid coupon');}
renderCart();
</script></body></html>
